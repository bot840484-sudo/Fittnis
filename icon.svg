<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f78166;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f85149;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d29922;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="url(#iconGrad)" stroke-width="4"/>

  <!-- Dumbbell icon -->
  <g filter="url(#glow)">
    <!-- Left weight -->
    <rect x="100" y="196" width="56" height="120" rx="8" fill="url(#iconGrad)"/>
    <rect x="108" y="204" width="40" height="104" rx="4" fill="#0d1117"/>

    <!-- Bar -->
    <rect x="156" y="246" width="200" height="20" rx="10" fill="url(#iconGrad)"/>
    <rect x="164" y="250" width="184" height="12" rx="6" fill="#0d1117"/>

    <!-- Right weight -->
    <rect x="356" y="196" width="56" height="120" rx="8" fill="url(#iconGrad)"/>
    <rect x="364" y="204" width="40" height="104" rx="4" fill="#0d1117"/>

    <!-- Center grip texture -->
    <g fill="none" stroke="#f78166" stroke-width="2" stroke-opacity="0.6">
      <line x1="216" y1="250" x2="216" y2="262"/>
      <line x1="236" y1="250" x2="236" y2="262"/>
      <line x1="256" y1="250" x2="256" y2="262"/>
      <line x1="276" y1="250" x2="276" y2="262"/>
      <line x1="296" y1="250" x2="296" y2="262"/>
    </g>
  </g>

  <!-- Accent ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#iconGrad)" stroke-width="2" stroke-opacity="0.5"/>

  <!-- "F" letter subtle watermark -->
  <text x="256" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="80" font-weight="800"
        fill="url(#iconGrad)" fill-opacity="0.15" text-anchor="middle" dominant-baseline="middle">F</text>
</svg>