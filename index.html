<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12181f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Mashq Kuzatuvchi</title>
<style>
:root{--bg:#eef1f4;--cd:#fff;--tx:#12181f;--mu:#667085;--ac:#2f5bff;--ok:#12a150;--bd:#dde3ea;--dg:#d92d20;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0e1217;--cd:#171d25;--tx:#e8edf3;--mu:#8e9aab;--ac:#6f8cff;--ok:#32d583;--bd:#27303b;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font:16px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
#v,#lg{max-width:520px;margin:0 auto;padding:12px 14px}
h2{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:10px 0 12px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.card ul{margin:6px 0 0;padding-left:18px}
input,select,button{font:inherit;color:var(--tx);border:1px solid var(--bd);background:var(--bg);border-radius:10px;padding:10px 12px;min-width:0}
input,select{width:100%;margin:6px 0}
input[type=checkbox]{width:22px;height:22px;margin:0 10px 0 0;accent-color:var(--ok)}
button{background:var(--ac);color:#fff;border:0;font-weight:700;cursor:pointer}
button.g{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
button.w{width:100%;margin-top:6px}
button.x{background:none;color:var(--mu);padding:4px 10px;font-size:20px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.f{display:flex;gap:8px;align-items:center}.f>*{flex:1}.f>button{flex:0 0 auto}
.row{display:flex;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.fl{flex:1}.tm{font-variant-numeric:tabular-nums;color:var(--mu);margin-right:10px}
.mu{color:var(--mu);font-size:14px;margin:6px 0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g2 .card{margin:0}
.big{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1}
.g2{margin-bottom:12px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;color:var(--mu);font-size:11px;font-weight:600;padding:6px 0}
nav button span{display:block;font-size:20px}nav button.on{color:var(--ac)}
pre{white-space:pre-wrap;font:inherit;margin:8px 0 0}
</style></head><body>
<div id="lg"><div class="card"><h2>Mashq Kuzatuvchi</h2>
<input id="un" placeholder="Ism" autocomplete="username" autocapitalize="none">
<input id="pw" type="password" placeholder="Parol" autocomplete="current-password">
<div class="f"><button onclick="auth(0)">Kirish</button><button class="g" onclick="auth(1)">Ro’yxatdan o’tish</button></div>
<p id="em" class="mu">Birinchi marta bo’lsangiz, ism va parol yozib “Ro’yxatdan o’tish”ni bosing.</p></div></div>
<main id="ap" hidden><div id="v"></div>
<nav><button data-t="t" onclick="go('t')"><span>📅</span>Bugun</button><button data-t="l" onclick="go('l')"><span>🏋️</span>Mashq</button><button data-t="p" onclick="go('p')"><span>📈</span>Progress</button><button data-t="a" onclick="go('a')"><span>🤖</span>Reja</button><button data-t="s" onclick="go('s')"><span>⚙️</span>Sozlama</button></nav></main>
<script>
const $=s=>document.querySelector(s),D=(d=new Date())=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const L=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},S=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const id=()=>Math.random().toString(36).slice(2,9);
let U=null,DB=null,tab='t';
const save=()=>S('mt_d_'+U,DB);
const msg=t=>{$('#em').textContent=t};
async function hash(p,s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function auth(reg){
 const n=$('#un').value.trim().toLowerCase(),p=$('#pw').value;
 if(!n||p.length<4)return msg('Ism yozing, parol kamida 4 belgi bo’lsin.');
 if(!window.crypto||!crypto.subtle)return msg('Bu sahifa https orqali ochilishi kerak.');
 const us=L('mt_u')||{};
 if(reg){if(us[n])return msg('Bu ism band. Boshqa ism tanlang.');const salt=[...crypto.getRandomValues(new Uint32Array(3))].join('-');us[n]={salt,h:await hash(p,salt)};S('mt_u',us)}
 else{const u=us[n];if(!u||u.h!==await hash(p,u.salt))return msg('Ism yoki parol noto’g’ri.')}
 sessionStorage.setItem('mt_s',n);start(n)}
function start(n){U=n;DB=L('mt_d_'+n)||{s:[],l:[],b:[],p:null,c:{goal:3}};DB.c=DB.c||{goal:3};$('#lg').hidden=true;$('#ap').hidden=false;go('t')}
function out(){sessionStorage.removeItem('mt_s');location.reload()}
const V={t:vToday,l:vLog,p:vProg,a:vPlan,s:vSet};
function go(t){tab=t||tab;$('#v').innerHTML=V[tab]();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab))}
const DN=['Yak','Dush','Sesh','Chor','Pay','Jum','Shan'];
/* ---- Bugun ---- */
function stats(){const ds=new Set(DB.l.map(x=>x.d));let s=0,c=new Date();if(!ds.has(D(c)))c.setDate(c.getDate()-1);while(ds.has(D(c))){s++;c.setDate(c.getDate()-1)}
 const w=new Date();w.setDate(w.getDate()-((w.getDay()+6)%7));const wk=[...ds].filter(x=>x>=D(w)).length;
 return`<div class="g2"><div class="card"><div class="big">${s}</div><span class="mu">kun ketma-ket</span></div><div class="card"><div class="big">${wk}/${DB.c.goal}</div><span class="mu">shu hafta</span></div></div>`}
const planDay=()=>DB.p&&DB.p.days.find(x=>x.wd==new Date().getDay());
function vToday(){const d=D(),dn=DB.s.slice().sort((a,b)=>a.t.localeCompare(b.t)),pd=planDay();
 return`<h2>Bugun</h2>`+stats()+(pd?`<div class="card"><b>Rejada: ${E(pd.name)}</b><ul>${pd.ex.map(x=>`<li>${E(x)}</li>`).join('')}</ul></div>`:'')+
 `<div class="card"><b>Kunlik tartib</b>`+(dn.length?dn.map(i=>`<div class="row"><input type="checkbox" ${i.d&&i.d[d]?'checked':''} onchange="tick('${i.id}')"><span class="tm">${i.t}</span><span class="fl">${E(i.n)}</span><button class="x" onclick="delS('${i.id}')" aria-label="O’chirish">×</button></div>`).join(''):'<p class="mu">Hali vazifa yo’q. Vaqt va nom kiritib qo’shing.</p>')+
 `<div class="f"><input type="time" id="st" value="07:00" style="max-width:120px"><input id="sn" placeholder="Nima qilasiz?"><button onclick="addS()">Qo’shish</button></div></div>`}
function addS(){const n=$('#sn').value.trim();if(!n)return;DB.s.push({id:id(),t:$('#st').value||'07:00',n,d:{}});save();go()}
function tick(i){const x=DB.s.find(y=>y.id==i),d=D();x.d=x.d||{};x.d[d]=!x.d[d];save()}
function delS(i){DB.s=DB.s.filter(x=>x.id!=i);save();go()}
/* ---- Mashq ---- */
const EX=['Shtanga yotib siqish','Otjimaniya','Tortilish','Pritsedaniya','Shtanga o’tirib-turish','Rumin tortish','Gantel yelka siqish','Plank','Biceps','Triceps','Oyoq pressi','Yugurish'];
function vLog(){const d=D(),t=DB.l.filter(x=>x.d===d);
 return`<h2>Mashq</h2><div class="card"><datalist id="ex">${EX.map(x=>`<option>${x}</option>`).join('')}</datalist>
 <input id="le" list="ex" placeholder="Mashq nomi"><div class="f"><input id="ls" type="number" inputmode="numeric" placeholder="Set"><input id="lr" type="number" inputmode="numeric" placeholder="Takror"><input id="lk" type="number" inputmode="decimal" step=".5" placeholder="kg"></div>
 <button class="w" onclick="addL()">Yozib qo’yish</button></div>
 <div class="card"><b>Bugungi mashqlar</b>`+(t.length?t.map(x=>`<div class="row"><span class="fl">${E(x.e)}</span><span>${x.s}×${x.r}${x.k?' · '+x.k+' kg':''}</span><button class="x" onclick="delL('${x.id}')" aria-label="O’chirish">×</button></div>`).join(''):'<p class="mu">Bugun hali hech narsa yozilmagan.</p>')+`</div>
 <div class="card"><b>Dam olish taymeri</b><div class="big" id="tmr">0:00</div><div class="f" style="margin-top:8px">${[30,60,90,120].map(s=>`<button class="g" onclick="rest(${s})">${s} s</button>`).join('')}</div></div>`}
function addL(){const e=$('#le').value.trim(),s=+$('#ls').value,r=+$('#lr').value,k=+$('#lk').value||0;if(!e||!s||!r)return alert('Mashq nomi, set va takrorni kiriting.');DB.l.push({id:id(),d:D(),e,s,r,k});save();go()}
function delL(i){DB.l=DB.l.filter(x=>x.id!=i);save();go()}
let tI=null;function rest(n){clearInterval(tI);const e=$('#tmr');tI=setInterval(()=>{if(tab!='l'||!$('#tmr'))return clearInterval(tI);$('#tmr').textContent=Math.floor(n/60)+':'+String(n%60).padStart(2,'0');if(n--<=0){clearInterval(tI);$('#tmr').textContent='Tayyor!';navigator.vibrate&&navigator.vibrate([300,100,300])}},1000)}
/* ---- Progress ---- */
function chart(pts,type){if(!pts.length||(type=='line'&&pts.length<2))return'<p class="mu">Grafik uchun kamida 2 ta yozuv kerak.</p>';
 const W=320,H=130,m=Math.max(...pts.map(p=>p.v))||1,mn=type=='line'?Math.min(...pts.map(p=>p.v)):0,r=(m-mn)||1,n=pts.length,st=(W-40)/Math.max(n-(type=='line'?1:0),1);
 const x=i=>20+i*st,y=v=>H-22-(v-mn)/r*(H-44);let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">`;
 if(type=='line')s+=`<polyline fill="none" stroke="var(--ac)" stroke-width="2.5" points="${pts.map((p,i)=>x(i)+','+y(p.v)).join(' ')}"/>`+pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="3.5" fill="var(--ac)"/><text x="${x(i)}" y="${y(p.v)-7}" font-size="9" text-anchor="middle" fill="var(--mu)">${p.v}</text>`).join('');
 else s+=pts.map((p,i)=>{const h=p.v/m*(H-44);return`<rect x="${x(i)}" y="${H-22-h}" width="${st*.7}" height="${h}" rx="3" fill="var(--ac)"/>`}).join('');
 return s+pts.map((p,i)=>`<text x="${x(i)+(type=='line'?0:st*.35)}" y="${H-6}" font-size="9" text-anchor="middle" fill="var(--mu)">${p.l}</text>`).join('')+'</svg>'}
function wkv(){const o=[],t=new Date();t.setDate(t.getDate()-((t.getDay()+6)%7));for(let i=7;i>=0;i--){const a=new Date(t);a.setDate(a.getDate()-i*7);const b=new Date(a);b.setDate(b.getDate()+7);const A=D(a),Z=D(b);o.push({l:A.slice(5),v:DB.l.filter(x=>x.d>=A&&x.d<Z).reduce((s,x)=>s+x.s*x.r*(x.k||1),0)})}return o}
function vProg(){const pr={};DB.l.forEach(x=>{if(x.k>(pr[x.e]||0))pr[x.e]=x.k});const bw=DB.b.slice(-8).map(x=>({l:x.d.slice(5),v:x.k}));
 return`<h2>Progress</h2><div class="card"><b>Haftalik hajm</b><p class="mu">set × takror × kg yig’indisi</p>${chart(wkv(),'bar')}</div>
 <div class="card"><b>Tana vazni (kg)</b>${chart(bw,'line')}
 <div class="f"><input id="bk" type="number" inputmode="decimal" step=".1" placeholder="Vazn"><input id="bw" type="number" inputmode="decimal" placeholder="Bel sm"><input id="bc" type="number" inputmode="decimal" placeholder="Ko’krak sm"></div><button class="w" onclick="addB()">Bugungi o’lchovni yozish</button>
 ${DB.b.slice(-4).reverse().map(x=>`<div class="row"><span class="tm">${x.d.slice(5)}</span><span class="fl">${x.k||'–'} kg · bel ${x.w||'–'} · ko’krak ${x.c||'–'}</span></div>`).join('')}</div>
 <div class="card"><b>Shaxsiy rekordlar</b>`+(Object.keys(pr).length?Object.entries(pr).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="row"><span class="fl">${E(k)}</span><b>${v} kg</b></div>`).join(''):'<p class="mu">Og’irlik bilan mashq yozsangiz, rekordlar shu yerda chiqadi.</p>')+`</div>`}
function addB(){const k=+$('#bk').value||0,w=+$('#bw').value||0,c=+$('#bc').value||0;if(!k&&!w&&!c)return;DB.b=DB.b.filter(x=>x.d!=D());DB.b.push({d:D(),k,w,c});DB.b.sort((a,b)=>a.d.localeCompare(b.d));save();go()}
/* ---- AI reja ---- */
const G={mass:'massa yig’ish',lose:'ozish',str:'kuch',fit:'sog’lom bo’lish'},N={push:'Ko’krak, yelka, triceps',pull:'Orqa va biceps',leg:'Oyoq',up:'Yuqori tana',low:'Pastki tana',full:'Butun tana'};
const B={gym:{push:['Shtanga yotib siqish','Gantel yelka siqish','Qiya gantel siqish','Triceps blok','Yon ko’tarish'],pull:['Tortilish','Yuqori blok tortish','Shtanga tortish','Gantel biceps','Orqa delta'],leg:['Shtanga o’tirib-turish','Oyoq pressi','Rumin tortish','Oyoq bukish','Boldir ko’tarish'],core:['Plank','Oyoqni ko’tarish']},
 home:{push:['Otjimaniya','Qiya otjimaniya','Pike otjimaniya','Triceps tayanch','Keng otjimaniya'],pull:['Turnikda tortilish','Rezina bilan tortish','Supermen','Rezina biceps','Teskari tortilish'],leg:['Pritsedaniya','Lunge','Bolgar split','Glute ko’prik','Boldir ko’tarish'],core:['Plank','Oyoqni ko’tarish']}};
const SP={2:['full','full'],3:['full','full','full'],4:['up','low','up','low'],5:['push','pull','leg','push','pull'],6:['push','pull','leg','push','pull','leg']},WD={2:[1,4],3:[1,3,5],4:[1,2,4,5],5:[1,2,3,4,5],6:[1,2,3,4,5,6]};
const pick=(a,n,o)=>Array.from({length:n},(_,i)=>a[(i+o)%a.length]);
function mk(t,b,o){const f={push:()=>pick(b.push,4,o),pull:()=>pick(b.pull,4,o),leg:()=>pick(b.leg,4,o).concat(b.core[0]),up:()=>pick(b.push,3,o).concat(pick(b.pull,3,o)),low:()=>pick(b.leg,5,o).concat(b.core[1]),full:()=>[b.leg[o%5],b.push[o%5],b.pull[o%5],b.leg[(o+1)%5],b.push[(o+1)%5],b.core[0]]};return f[t]()}
function vPlan(){const P=DB.c.prof||{a:'',h:'',w:'',g:'mass',d:3,pl:'gym'},o=(v,t,c)=>`<option value="${v}" ${c==v?'selected':''}>${t}</option>`;
 return`<h2>Reja</h2><div class="card"><b>Sizga mos reja tuzamiz</b>
 <div class="f"><input id="pa" type="number" inputmode="numeric" placeholder="Yosh" value="${P.a}"><input id="ph" type="number" inputmode="numeric" placeholder="Bo’y sm" value="${P.h}"><input id="pv" type="number" inputmode="decimal" placeholder="Vazn kg" value="${P.w}"></div>
 <select id="pg">${Object.keys(G).map(k=>o(k,'Maqsad: '+G[k],P.g)).join('')}</select>
 <select id="pd">${[2,3,4,5,6].map(n=>o(n,'Haftada '+n+' kun',P.d)).join('')}</select>
 <select id="pp">${o('gym','Joy: zal',P.pl)}${o('home','Joy: uyda',P.pl)}</select>
 <button class="w" onclick="genPlan()">Reja tuzish</button></div>`+(DB.p?`<div class="card"><b>Tana massa indeksi: ${DB.p.bmi}</b>${DB.p.young?'<p class="mu">16 yoshgacha og’ir shtangadan qochib, murabbiy nazoratida mashq qiling.</p>':''}<p class="mu">Reja umumiy yo’l-yo’riq. Og’riq yoki kasallik bo’lsa, avval shifokorga ko’rining.</p></div>`+DB.p.days.map(x=>`<div class="card"><b>${DN[x.wd]} · ${E(x.name)}</b><ul>${x.ex.map(e=>`<li>${E(e)}</li>`).join('')}</ul></div>`).join('')+
 (DB.c.key?`<button class="w" onclick="ai()">Claude bilan shaxsiylashtirish</button><div class="card" id="ao" hidden></div>`:'<p class="mu">Sozlamalarda Claude API kalitini kiritsangiz, reja Claude yordamida yanada shaxsiylashtiriladi.</p>'):'')}
function genPlan(){const a=+$('#pa').value,h=+$('#ph').value,w=+$('#pv').value,g=$('#pg').value,d=+$('#pd').value,pl=$('#pp').value;
 if(!(a>=10&&a<=90&&h>=100&&h<=230&&w>=30&&w<=250))return alert('Yosh, bo’y va vaznni to’g’ri kiriting.');
 const sc={mass:'4×8-12',lose:'3×12-15',str:'5×5',fit:'3×10-12'}[g];
 const days=SP[d].map((t,i)=>{const ex=mk(t,B[pl],i).map(x=>x+' — '+sc);if(g=='lose')ex.push('Yurish yoki yengil yugurish 20-30 daqiqa');return{name:N[t],ex,wd:WD[d][i]}});
 DB.c.prof={a,h,w,g,d,pl};DB.c.goal=d;DB.p={bmi:(w/((h/100)**2)).toFixed(1),young:a<16,days};save();go()}
async function ai(){const o=$('#ao');o.hidden=false;o.textContent='Claude o’ylayapti…';const P=DB.c.prof;
 try{const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':DB.c.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-5-5',max_tokens:1200,messages:[{role:'user',content:`Men ${P.a} yoshdaman, bo’yim ${P.h} sm, vaznim ${P.w} kg. Maqsad: ${G[P.g]}. Haftada ${P.d} kun, joy: ${P.pl=='gym'?'zal':'uy'}.\nDastlabki rejam:\n${DB.p.days.map(x=>DN[x.wd]+' '+x.name+': '+x.ex.join('; ')).join('\n')}\nUni menga moslab yaxshila, har hafta yuklamani qanday oshirishni va xavfsizlik bo’yicha qisqa maslahat ber. O’zbek tilida, qisqa yoz.`}]})});
 const j=await r.json();o.innerHTML='<pre></pre>';o.firstChild.textContent=j.content?j.content.map(c=>c.text||'').join(''):((j.error&&j.error.message)||'Xatolik yuz berdi.')}
 catch(e){o.textContent='Ulanib bo’lmadi. Internet va kalitni tekshiring.'}}
/* ---- Sozlama ---- */
function vSet(){return`<h2>Sozlamalar</h2><div class="card"><b>Haftalik maqsad</b><select onchange="DB.c.goal=+this.value;save()">${[1,2,3,4,5,6,7].map(n=>`<option value="${n}" ${DB.c.goal==n?'selected':''}>Haftada ${n} kun</option>`).join('')}</select></div>
 <div class="card"><b>Eslatmalar</b><p class="mu">Tartibdagi vaqt kelganda bildirishnoma chiqadi (ilova ochiq yoki fonda bo’lsa).</p><button onclick="notif()">Yoqish</button></div>
 <div class="card"><b>Claude API kaliti (ixtiyoriy)</b><p class="mu">Faqat shu telefonda saqlanadi.</p><input id="ak" type="password" placeholder="sk-ant-..." value="${E(DB.c.key||'')}"><button class="w" onclick="DB.c.key=$('#ak').value.trim();save();alert('Saqlandi')">Saqlash</button></div>
 <div class="card"><b>Zaxira nusxa</b><p class="mu">Telefonni almashtirsangiz, ma’lumotni shu fayl orqali o’tkazasiz.</p><div class="f"><button onclick="exp()">Yuklab olish</button><button class="g" onclick="$('#imp').click()">Tiklash</button></div><input id="imp" type="file" accept=".json" hidden onchange="imp(this)"></div>
 <button class="w g" onclick="out()">Chiqish (${E(U)})</button>`}
function notif(){if(!window.Notification)return alert('Bu brauzer bildirishnomani qo’llamaydi.');Notification.requestPermission().then(p=>alert(p=='granted'?'Yoqildi':'Ruxsat berilmadi'))}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({...DB,c:{...DB.c,key:''}})],{type:'application/json'}));a.download='mashq-zaxira-'+D()+'.json';a.click()}
function imp(i){const f=i.files[0];if(!f)return;f.text().then(t=>{try{const o=JSON.parse(t);if(!Array.isArray(o.l)||!Array.isArray(o.s))throw 0;o.c=Object.assign({goal:3},o.c,{key:DB.c.key});o.b=o.b||[];DB=o;save();go();alert('Tiklandi')}catch(e){alert('Fayl noto’g’ri.')}})}
const fired={};setInterval(()=>{if(!DB||!window.Notification||Notification.permission!='granted'||!navigator.serviceWorker)return;const hm=new Date().toTimeString().slice(0,5),d=D();DB.s.forEach(i=>{if(i.t==hm&&!(i.d&&i.d[d])&&!fired[i.id+d]){fired[i.id+d]=1;navigator.serviceWorker.ready.then(r=>r.showNotification('Vaqt bo’ldi',{body:i.n,icon:'icon-192.png'}))}})},20000);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
