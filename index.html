 pen();$('#lg').hidden=true;$('#ap').hidden=false;msg('');go('t');push()}

 const w=new Date();w.setDate(w.getDate()-((w.getDay()+6)%7));const wk=[...ds].filter(x=>x>=D(w)).length;

 return`<h2>Kunlik quest</h2>`+hdr()+stats()+`<div class="card"><b>Reyting</b><div id="fr"><p class="mu">Yuklanmoqda…</p></div></div>`+(pd?`<div class="card"><b>QUEST: ${E(pd.name)}</b><ul>${pd.ex.map(x=>`<li>${E(x)}</li>`).join('')}</ul></div>`:'')+
 `<div class="card"><b>Kunlik tartib</b>`+(dn.length?dn.map(i=>`<div class="row"><input type="checkbox" ${i.d&&i.d[d]?'checked':''} onchange="tick('${i.id}')"><span class="tm">${i.t}</span><span class="fl">${E(i.n)}</span><button class="x" onclick="delS('${i.id}')" aria-label="O’chirish">×</button></div>`).join(''):'<p class="mu">Hali vazifa yo’q. Vaqt va nom kiritib qo’shing.</p>')+

"Kardio":"Yugurish|Yurish|Velosiped yo’lak|Arqon sakrash|Eshkak mashinasi|Elliptik|Suzish|Burpi|Zinapoya|Sprint|Kopcha yugurish|Kross|Aerobika|Tabata|Zumba|Sakrash jek|Boks sumkasi|Pogo sakrash|Yengil yugurish|HIIT"};
const GR=Object.keys(EXG),ALL=[].concat(...GR.map(g=>EXG[g].split('|'))),gOf=e=>GR.find(g=>EXG[g].split('|').includes(e))||'Boshqa';

function lastSets(e){const ds=[...new Set(DB.l.filter(x=>x.e==e&&x.d<D()).map(x=>x.d))].sort(),d=ds[ds.length-1];return d?DB.l.filter(x=>x.e==e&&x.d==d):[]}

const SP={2:['full','full'],3:['full','full','full'],4:['up','low','up','low'],5:['push','pull','leg','push','pull'],6:['push','pull','leg','push','pull','leg']},WD={2:[1,4],3:[1,3,5],4:[1,2,4,5],5:[1,2,3,4,5],6:[1,2,3,4,5,6]};
const pick=(a,n,o)=>Array.from({length:n},(_,i)=>a[(i+o)%a.length]);
function mk(t,b,o){const f={push:()=>pick(b.push,4,o),pull:()=>pick(b.pull,4,o),leg:()=>pick(b.leg,4,o).concat(b.core[0]),up:()=>pick(b.push,3,o).concat(pick(b.pull,3,o)),low:()=>pick(b.leg,5,o).concat(b.core[1]),full:()=>[b.leg[o%5],b.push[o%5],b.pull[o%5],b.leg[(o+1)%5],b.push[(o+1)%5],b.core[0]]};return f[t]()}
function vPlan(){const P=DB.c.prof||{a:'',h:'',w:'',g:'mass',d:3,pl:'gym'},o=(v,t,c)=>`<option value="${v}" ${c==v?'selected':''}>${t}</option>`;
 return`<h2>Reja</h2>${wsum()}<div class="card"><b>Sizga mos reja tuzamiz</b>
 <div class="f"><input id="pa" type="number" inputmode="numeric" placeholder="Yosh" value="${P.a}"><input id="ph" type="number" inputmode="numeric" placeholder="Bo’y sm" value="${P.h}"><input id="pv" type="number" inputmode="decimal" placeholder="Vazn kg" value="${P.w}"></div>
 <select id="pg">${Object.keys(G).map(k=>o(k,'Maqsad: '+G[k],P.g)).join('')}</select>
 <select id="pd">${[2,3,4,5,6].map(n=>o(n,'Haftada '+n+' kun',P.d)).join('')}</select>
 <select id="pp">${o('gym','Joy: zal',P.pl)}${o('home','Joy: uyda',P.pl)}</select>
 <button class="w" onclick="genPlan()">Reja tuzish</button>${DB.c.key?`<input id="pn" placeholder="Jarohat, jihoz yoki istak (AI uchun)" value="${E(DB.c.note||'')}"><button class="w g" onclick="ai2()">AI bilan noldan tuzish</button><p id="as" class="mu"></p>`:''}</div>`+(DB.p?`<div class="card"><b>Tana massa indeksi: ${DB.p.bmi}</b>${DB.p.young?'<p class="mu">16 yoshgacha og’ir shtangadan qochib, murabbiy nazoratida mashq qiling.</p>':''}<p class="mu">Reja umumiy yo’l-yo’riq. Og’riq yoki kasallik bo’lsa, avval shifokorga ko’rining.</p></div>`+DB.p.days.map(x=>`<div class="card"><b>${DN[x.wd]} · ${E(x.name)}</b><ul>${x.ex.map(e=>`<li>${E(e)}</li>`).join('')}</ul></div>`).join('')+
 (DB.c.key?`<button class="w" onclick="ai()">AI bilan shaxsiylashtirish</button><div class="card" id="ao" hidden></div>`:'<p class="mu">Sozlamalarda AI kalitini (Claude yoki Gemini) kiritsangiz, reja AI yordamida yanada shaxsiylashtiriladi.</p>'):'')}
function genPlan(){const a=+$('#pa').value,h=+$('#ph').value,w=+$('#pv').value,g=$('#pg').value,d=+$('#pd').value,pl=$('#pp').value;
 if(!(a>=10&&a<=90&&h>=100&&h<=230&&w>=30&&w<=250))return alert('Yosh, bo’y va vaznni to’g’ri kiriting.');
 const sc={mass:'4×8-12',lose:'3×12-15',str:'5×5',fit:'3×10-12'}[g];
 const days=SP[d].map((t,i)=>{const ex=mk(t,B[pl],i).map(x=>x+' — '+sc);if(g=='lose')ex.push('Yurish yoki yengil yugurish 20-30 daqiqa');return{name:N[t],ex,wd:WD[d][i]}});
 DB.c.prof={a,h,w,g,d,pl};DB.c.goal=d;DB.p={bmi:(w/((h/100)**2)).toFixed(1),young:a<16,at:D(),days};save();go()}
async function llm(q,json){const K=DB.c.key;let j,t;
 if(K.startsWith('sk-ant')){const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':K,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-5-5',max_tokens:json?3000:1200,messages:[{role:'user',content:q}]})});j=await r.json();t=j.content&&j.content.map(c=>c.text||'').join('')}
 else{const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent',{method:'POST',headers:{'content-type':'application/json','x-goog-api-key':K},body:JSON.stringify({contents:[{parts:[{text:q}]}],generationConfig:json?{responseMimeType:'application/json'}:{}})});j=await r.json();t=j.candidates&&j.candidates[0]&&j.candidates[0].content.parts.map(c=>c.text||'').join('')}
 if(!t)throw new Error((j.error&&j.error.message)||'Javob kelmadi');return t}
async function ai(){const o=$('#ao');o.hidden=false;o.textContent='AI o’ylayapti…';const P=DB.c.prof;
 try{const t=await llm(`Men ${P.a} yoshdaman, bo’yim ${P.h} sm, vaznim ${P.w} kg. Maqsad: ${G[P.g]}. Haftada ${P.d} kun, joy: ${P.pl=='gym'?'zal':'uy'}.\nDastlabki rejam:\n${DB.p.days.map(x=>DN[x.wd]+' '+x.name+': '+x.ex.join('; ')).join('\n')}\nUni menga moslab yaxshila, har hafta yuklamani qanday oshirishni va xavfsizlik bo’yicha qisqa maslahat ber. O’zbek tilida, qisqa yoz.`);o.innerHTML='<pre></pre>';o.firstChild.textContent=t}
 catch(e){o.textContent='Xato: '+e.message}}
async function ai2(){const s=$('#as'),a=+$('#pa').value,h=+$('#ph').value,w=+$('#pv').value,g=$('#pg').value,d=+$('#pd').value,pl=$('#pp').value,n=$('#pn').value.trim();
 if(!(a>=10&&a<=90&&h>=100&&h<=230&&w>=30&&w<=250))return alert('Yosh, bo’y va vaznni to’g’ri kiriting.');
 s.textContent='AI reja tuzmoqda…';DB.c.note=n;
 try{const t=await llm(`Men ${a} yoshdaman, bo’yim ${h} sm, vaznim ${w} kg. Maqsad: ${G[g]}. Haftada ${d} kun, joy: ${pl=='gym'?'zal':'uy'}. Izoh yoki jarohat: ${n||'yo’q'}.\nMenga haftalik mashq rejasi tuz. Faqat JSON qaytar, boshqa matn yozma: {"days":[{"wd":1,"name":"Ko’krak va triceps","ex":["Otjimaniya — 4×10-12"]}]}. Qoidalar: aynan ${d} ta kun; wd hafta kuni raqami (0=yakshanba, 1=dushanba, ... 6=shanba), kunlar har xil bo’lsin; har kunda 4-6 mashq; mashq nomlari o’zbek tilida va "nomi — set×takror" ko’rinishida; jarohat bo’lsa o’sha joyni yuklamaydigan mashqlarni tanla.`,1);
  const j=JSON.parse(t.slice(t.indexOf('{'),t.lastIndexOf('}')+1)),days=(j.days||[]).filter(x=>Number.isInteger(x.wd)&&x.wd>=0&&x.wd<=6&&Array.isArray(x.ex)&&x.ex.length).map(x=>({wd:x.wd,name:String(x.name||'Mashq').slice(0,60),ex:x.ex.map(e=>String(e).slice(0,80))}));
  if(!days.length)throw new Error('Reja noto’g’ri formatda keldi, qayta urinib ko’ring.');
  DB.c.prof={a,h,w,g,d,pl};DB.c.goal=days.length;DB.p={bmi:(w/((h/100)**2)).toFixed(1),young:a<16,at:D(),days};save();go()}
 catch(e){s.textContent='Xato: '+e.message}}
function wkStart(){const w=new Date();w.setDate(w.getDate()-((w.getDay()+6)%7));return D(w)}
function rep7(){const A=wkStart(),l=DB.l.filter(x=>x.d>=A),days=new Set(l.map(x=>x.d)).size,sets=l.reduce((s,x)=>s+x.s,0),vol=l.reduce((s,x)=>s+x.s*x.r*(x.k||1),0),ec={};l.forEach(x=>ec[x.e]=(ec[x.e]||0)+x.s);
 const top=Object.entries(ec).sort((a,b)=>b[1]-a[1])[0],lv=lvl(),c=document.createElement('canvas');c.width=800;c.height=1000;const g=c.getContext('2d'),gr=g.createLinearGradient(0,0,0,1000);
 gr.addColorStop(0,'#0d2a6b');gr.addColorStop(.5,'#05070f');g.fillStyle=gr;g.fillRect(0,0,800,1000);g.strokeStyle='#3aa0ff';g.lineWidth=4;g.strokeRect(30,30,740,940);
 const T=(t,x,y,z,al)=>{g.font='800 '+z+'px sans-serif';g.fillStyle='#fff';g.textAlign=al||'left';g.shadowColor='#3aa0ff';g.shadowBlur=18;g.fillText(t,x,y)};
 T('[ HAFTALIK HISOBOT ]',400,120,44,'center');T(U.split('@')[0],400,190,30,'center');T('LV.'+lv,400,360,130,'center');T('RANK '+RK(lv),400,440,48,'center');
 [['Mashq kunlari',days+'/'+DB.c.goal],['Setlar',sets],['Hajm',vol+' kg'],['Ketma-ket kun',strk()],['Eng ko’p mashq',top?top[0].slice(0,18):'–']].forEach((q,i)=>{T(q[0],80,560+i*80,32);T(String(q[1]),720,560+i*80,32,'right')});
 T(A+' haftasi',400,950,24,'center');
 c.toBlob(b=>{const f=new File([b],'hisobot.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f],title:'Haftalik hisobot'}).catch(()=>{});else{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='hisobot.png';a.click()}})}
async function loadFr(){const el=$('#fr');if(!el||!SS)return;
 try{const r=await api('/rest/v1/profiles?select=*&user_id=eq.'+SS.uid);if(!r.ok){el.innerHTML='<p class="mu">Reyting hali yoqilmagan.</p>';return}
  const me=(await r.json())[0];
  if(!me){el.innerHTML='<input id="nk" placeholder="Laqabingiz (do’stlar ko’radi)"><button class="w" onclick="joinFr()">Reytingga qo’shilish</button>';return}
  const st={xp:xp(),lvl:lvl(),streak:strk(),wk:new Set(DB.l.filter(x=>x.d>=wkStart()).map(x=>x.d)).size,updated_at:new Date().toISOString()};
  api('/rest/v1/profiles?user_id=eq.'+SS.uid,{m:'PATCH',h:{Prefer:'return=minimal'},b:st});
  const f=await(await api('/rest/v1/friends?select=friend_id&user_id=eq.'+SS.uid)).json(),ids=[SS.uid,...f.map(x=>x.friend_id)];
  const p=await(await api('/rest/v1/profiles?select=*&user_id=in.('+ids.join(',')+')')).json();
  p.forEach(x=>{if(x.user_id==SS.uid)Object.assign(x,st)});p.sort((a,b)=>b.xp-a.xp);
  el.innerHTML=`<p class="mu">Sizning kodingiz: <b>${E(me.code)}</b></p>`+p.map((x,i)=>`<div class="row"><span class="tm">${i+1}</span><span class="fl">${E(x.name)}${x.user_id==SS.uid?' (siz)':''}</span><span>LV.${x.lvl} · ${x.xp} XP · 🔥${x.streak}</span></div>`).join('')+`<div class="f"><input id="fc" placeholder="Do’st kodi"><button onclick="addFr()">Qo’shish</button></div>`}
 catch(e){el.innerHTML='<p class="mu">Reyting yuklanmadi.</p>'}}
async function joinFr(){const n=$('#nk').value.trim().slice(0,20);if(!n)return alert('Laqab yozing.');
 for(let i=0;i<3;i++){const r=await api('/rest/v1/profiles',{m:'POST',h:{Prefer:'return=minimal'},b:{user_id:SS.uid,name:n,code:Math.random().toString(36).slice(2,8).toUpperCase(),xp:xp(),lvl:lvl(),streak:strk(),wk:0}});if(r.ok)break}go()}
async function addFr(){const c=$('#fc').value.trim().toUpperCase();if(!c)return;
 const j=await(await api('/rest/v1/profiles?select=user_id&code=eq.'+encodeURIComponent(c))).json();
 if(!j[0])return alert('Bunday kod topilmadi.');if(j[0].user_id==SS.uid)return alert('Bu sizning kodingiz.');
 const r=await api('/rest/v1/friends',{m:'POST',h:{Prefer:'return=minimal'},b:{user_id:SS.uid,friend_id:j[0].user_id}});if(!r.ok&&r.status!=409)alert('Qo’shib bo’lmadi.');go()}

 <div class="card"><b>Eslatmalar</b><p class="mu">Tartibdagi vaqt kelganda bildirishnoma chiqadi (ilova ochiq yoki fonda bo’lsa).</p><button onclick="notif()">Yoqish</button></div>
 <div class="card"><b>AI kaliti (Claude yoki Gemini, ixtiyoriy)</b><p class="mu">Faqat shu telefonda saqlanadi.</p><input id="ak" type="password" placeholder="Kalitni shu yerga qo’ying" value="${E(DB.c.key||'')}"><button class="w" onclick="DB.c.key=$('#ak').value.trim();save();alert('Saqlandi')">Saqlash</button></div>

SS=ss();if(SS&&SS.uid)refresh().then(ok=>ok?start():navigator.onLine?(SS=null,sessionStorage.removeItem('mt_s'),localStorage.removeItem('mt_s')):start());
